<div id="app" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px;border:1px solid var(--color-border-primary,rgba(127,127,127,.35));border-radius:12px;max-width:640px;color:var(--color-text-primary,inherit);background:var(--color-background-primary,transparent)">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><strong style="font-size:17px">WebCodex Computer App Image Matrix Probe</strong><span id="state" style="font-size:12px">HTML loaded</span></div>
  <div style="margin-top:12px;border:1px solid var(--color-border-secondary,rgba(127,127,127,.25));border-radius:10px;padding:20px;font-size:14px;text-align:center;background:rgba(127,127,127,.08)">
    <img id="image" alt="Synthetic native MCP image matrix probe" style="display:none;width:320px;height:180px;max-width:100%;object-fit:contain;margin:0 auto 12px;border:1px solid var(--color-border-secondary,rgba(127,127,127,.25));background:repeating-conic-gradient(rgba(127,127,127,.12) 0 25%,transparent 0 50%) 50%/16px 16px" />
    <div id="result">Waiting for the synthetic matrix image result…</div>
  </div>
  <div id="meta" style="margin-top:10px;font-size:12px">Minimal MCP Apps handshake · PNG/JPEG · 64–512 KiB · no Runner</div>
</div>
<script>
(() => {
  const APP_PROTOCOL = "2026-01-26";
  const MAX_FILE_BYTES = 512 * 1024;
  const MAX_ENCODED_IMAGE_CHARS = 4 * Math.ceil(MAX_FILE_BYTES / 3);
  const ALLOWED_CODECS = new Map([["png", "image/png"], ["jpeg", "image/jpeg"]]);
  const ALLOWED_DIMENSIONS = new Map([["640x360", [640, 360]], ["1280x720", [1280, 720]], ["1920x1080", [1920, 1080]], ["2560x1440", [2560, 1440]], ["3840x2160", [3840, 2160]]]);
  const ALLOWED_PAYLOADS = new Map([["64k", 64 * 1024], ["128k", 128 * 1024], ["256k", 256 * 1024], ["512k", 512 * 1024]]);
  const stateEl = document.getElementById("state");
  const imageEl = document.getElementById("image");
  const resultEl = document.getElementById("result");
  const metaEl = document.getElementById("meta");
  const pending = new Map();
  let nextId = 1;

  function request(method, params, timeoutMs = 10000) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => { pending.delete(id); reject(new Error(method + " timed out")); }, timeoutMs);
      pending.set(id, { resolve, reject, timeout });
      try { window.parent.postMessage({ jsonrpc: "2.0", id, method, params: params || {} }, "*"); }
      catch (error) { pending.delete(id); clearTimeout(timeout); reject(error); }
    });
  }

  function notify(method, params) { window.parent.postMessage({ jsonrpc: "2.0", method, ...(params === undefined ? {} : { params }) }, "*"); }

  function fail(message) {
    imageEl.onload = null;
    imageEl.onerror = null;
    stateEl.textContent = "result rejected";
    resultEl.textContent = message;
    imageEl.style.display = "none";
    imageEl.removeAttribute("src");
  }

  function renderToolResult(result) {
    const structured = result && typeof result === "object" ? result.structuredContent : null;
    const output = structured && typeof structured === "object" && structured.output && typeof structured.output === "object" ? structured.output : null;
    const codec = output && typeof output.codec === "string" ? output.codec : "";
    const dimension = output && typeof output.dimension === "string" ? output.dimension : "";
    const payload = output && typeof output.payload === "string" ? output.payload : "";
    const expectedMime = ALLOWED_CODECS.get(codec);
    const expectedDimension = ALLOWED_DIMENSIONS.get(dimension);
    const expectedBytes = ALLOWED_PAYLOADS.get(payload);
    if (!structured || structured.success !== true || !output || output.probe !== "image_matrix" || output.runner_used !== false || output.content_delivery !== "mcp_image" || !expectedMime || !expectedDimension || !expectedBytes) {
      fail("Image matrix probe structured result was missing or malformed."); return;
    }
    const width = Number.isInteger(output.width) ? output.width : 0;
    const height = Number.isInteger(output.height) ? output.height : 0;
    const bytes = Number.isInteger(output.file_bytes) ? output.file_bytes : 0;
    const mimeType = typeof output.mime_type === "string" ? output.mime_type : "";
    if (width !== expectedDimension[0] || height !== expectedDimension[1] || bytes !== expectedBytes || mimeType !== expectedMime) {
      fail("Image matrix probe metadata did not match the selected matrix cell."); return;
    }
    const image = Array.isArray(result.content) ? result.content.find((item) => item && typeof item === "object" && item.type === "image") : null;
    const deliveredMime = image && typeof image.mimeType === "string" ? image.mimeType : "";
    const data = image && typeof image.data === "string" ? image.data : "";
    if (deliveredMime !== expectedMime || !data || data.length > MAX_ENCODED_IMAGE_CHARS) { fail("Synthetic matrix native image content was missing or invalid."); return; }

    imageEl.onload = () => {
      if (imageEl.naturalWidth !== width || imageEl.naturalHeight !== height) { fail("Decoded image dimensions did not match the selected matrix cell."); return; }
      imageEl.onload = null;
      imageEl.onerror = null;
      stateEl.textContent = "native image decoded";
      resultEl.textContent = "Synthetic matrix image decoded successfully.";
      metaEl.textContent = "MCP Apps initialized · " + codec + " · " + dimension + " · " + payload + " · " + bytes + " B · decoded · no Runner";
    };
    imageEl.onerror = () => fail("Browser failed to decode the synthetic matrix image.");
    stateEl.textContent = "native image received";
    resultEl.textContent = "Native image received; waiting for browser decode…";
    imageEl.style.display = "block";
    imageEl.src = "data:" + deliveredMime + ";base64," + data;
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || typeof message !== "object" || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && pending.has(message.id)) {
      const item = pending.get(message.id); pending.delete(message.id); clearTimeout(item.timeout);
      if (message.error !== undefined) item.reject(message.error); else item.resolve(message.result); return;
    }
    if (message.method === "ui/notifications/tool-result") renderToolResult(message.params);
  }, { passive: true });

  async function initialize() {
    try {
      const result = await request("ui/initialize", { protocolVersion: APP_PROTOCOL, appInfo: { name: "webcodex-computer-app-image-matrix-probe", title: "WebCodex Computer App Image Matrix Probe", version: "1.0.0" }, appCapabilities: {} });
      const protocol = result && typeof result === "object" && typeof result.protocolVersion === "string" ? result.protocolVersion.slice(0, 64) : null;
      notify("ui/notifications/initialized", {});
      if (stateEl.textContent !== "native image received" && stateEl.textContent !== "native image decoded") {
        stateEl.textContent = "initialized";
        metaEl.textContent = "MCP Apps initialized" + (protocol ? " · " + protocol : "") + " · waiting for matrix image";
      }
    } catch (error) {
      stateEl.textContent = "init failed";
      metaEl.textContent = "ui/initialize failed: " + String(error && error.message ? error.message : error);
    }
  }

  void initialize();
})();
</script>
