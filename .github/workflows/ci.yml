name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Type-check frontend
        run: npm --prefix frontend run typecheck
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Verify committed frontend build
        run: npm --prefix frontend run check:dist
      - name: Verify workspace boundaries
        run: |
          bash scripts/workspace_boundary_check.sh --self-test
          bash scripts/workspace_boundary_check.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked --workspace

  test-windows:
    # Windows release gate: the crates that must run natively on Windows 11
    # (CLI, Runner, persistent-shell's fail-closed gate, and the
    # cross-platform libraries they depend on), the npm distribution checks,
    # and the full Windows artifact -> npm install smoke. The Server and its
    # Unix-only runtime stay Linux-only.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked -p webcodex-agent-config -p webcodex-process -p webcodex-persistent-shell -p webcodex-cli -p webcodex-runner
      - name: Test npm installer and release manifest natively
        run: npm --prefix npm/webcodex test
      - name: Windows artifact to npm install smoke
        # Builds the three Windows binaries, packages the win32-x64 artifact
        # with the native PowerShell script, installs it through the npm
        # installer into a temporary prefix, and verifies the wrapper plus
        # --version/--help and the failure-preserves-old-binaries path. Never
        # touches the npm registry.
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/npm_install_windows_smoke.ps1

  test-windows-arm64-x64-emulation:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: arm64

      - name: Verify ARM64 host and native Node
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          $nodePlatform = node -p "process.platform"
          $nodeArch = node -p "process.arch"
          Write-Host "node platform=$nodePlatform arch=$nodeArch"
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "expected an ARM64 Windows runner"
          }
          if ($nodePlatform -ne "win32" -or $nodeArch -ne "arm64") {
            throw "expected native win32-arm64 Node.js"
          }

      - name: Test npm installer source on ARM64
        run: npm --prefix npm/webcodex test

      - name: Install published x64 artifact from native ARM64 npm
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/npm_install_windows_arm64_compat_smoke.ps1

  test-windows-arm64-native:
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Verify native ARM64 Rust toolchain
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          rustc -vV
          $hostLine = rustc -vV | Select-String '^host: '
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "expected an ARM64 Windows runner"
          }
          if ($hostLine.Line -ne 'host: aarch64-pc-windows-msvc') {
            throw "expected native aarch64-pc-windows-msvc rustc host; got $($hostLine.Line)"
          }

      - name: Build native ARM64 binaries
        run: cargo build --locked --release --target aarch64-pc-windows-msvc -p webcodex -p webcodex-cli -p webcodex-runner

      - name: Verify ARM64 PE binaries and execute
        shell: pwsh
        run: |
          $binDir = Join-Path $PWD 'target\aarch64-pc-windows-msvc\release'
          $binaries = @('webcodex.exe', 'webcodex-server.exe', 'webcodex-runner.exe')
          foreach ($name in $binaries) {
            $path = Join-Path $binDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "missing native ARM64 binary: $path"
            }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 0x40) {
              throw "$name is too small to be a PE image"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) {
              throw "$name has an invalid PE header offset"
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            Write-Host "$name PE machine=0x$($machine.ToString('X4'))"
            if ($machine -ne 0xAA64) {
              throw "$name is not an ARM64 PE binary"
            }
          }

          & (Join-Path $binDir 'webcodex.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 webcodex --version failed' }
          & (Join-Path $binDir 'webcodex.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 webcodex --help failed' }
          & (Join-Path $binDir 'webcodex-runner.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 webcodex-runner --version failed' }
          & (Join-Path $binDir 'webcodex-server.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 webcodex-server --version failed' }
