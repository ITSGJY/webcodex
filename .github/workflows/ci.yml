name: CI

on:
  push:
    branches: [main, agent/windows-arm64-emulation-smoke]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Type-check frontend
        run: npm --prefix frontend run typecheck
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Verify committed frontend build
        run: npm --prefix frontend run check:dist
      - name: Verify workspace boundaries
        run: |
          bash scripts/workspace_boundary_check.sh --self-test
          bash scripts/workspace_boundary_check.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked --workspace

  test-windows:
    # Windows release gate: the crates that must run natively on Windows 11
    # (CLI, Runner, persistent-shell's fail-closed gate, and the
    # cross-platform libraries they depend on), the npm distribution checks,
    # and the full Windows artifact -> npm install smoke. The Server and its
    # Unix-only runtime stay Linux-only.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked -p webcodex-agent-config -p webcodex-process -p webcodex-persistent-shell -p webcodex-cli -p webcodex-runner
      - name: Test npm installer and release manifest natively
        run: npm --prefix npm/webcodex test
      - name: Windows artifact to npm install smoke
        # Builds the three Windows binaries, packages the win32-x64 artifact
        # with the native PowerShell script, installs it through the npm
        # installer into a temporary prefix, and verifies the wrapper plus
        # --version/--help and the failure-preserves-old-binaries path. Never
        # touches the npm registry.
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/npm_install_windows_smoke.ps1

  test-windows-arm64-x64-emulation:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: arm64

      - name: Verify ARM64 host and native Node
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          $nodePlatform = node -p "process.platform"
          $nodeArch = node -p "process.arch"
          Write-Host "node platform=$nodePlatform arch=$nodeArch"
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "expected an ARM64 Windows runner"
          }
          if ($nodePlatform -ne "win32" -or $nodeArch -ne "arm64") {
            throw "expected native win32-arm64 Node.js"
          }

      - name: Download current win32-x64 release artifact
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "npm/webcodex/package.json" -Raw | ConvertFrom-Json).version
          $url = "https://github.com/yyjeqhc/webcodex/releases/download/v$version/webcodex-v$version-win32-x64.tar.gz"
          $archive = Join-Path $env:RUNNER_TEMP "webcodex-win32-x64.tar.gz"
          $extract = Join-Path $env:RUNNER_TEMP "webcodex-win32-x64"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $archive
          & (Join-Path $env:SystemRoot "System32/tar.exe") -xzf $archive -C $extract
          if ($LASTEXITCODE -ne 0) {
            throw "failed to extract win32-x64 release artifact"
          }
          "WEBCODEX_X64_BIN=$extract" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify downloaded binaries are x64 PE files
        shell: pwsh
        run: |
          function Get-PeMachine([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }
          foreach ($name in @("webcodex.exe", "webcodex-server.exe", "webcodex-runner.exe")) {
            $path = Join-Path $env:WEBCODEX_X64_BIN $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "artifact is missing $name"
            }
            $machine = Get-PeMachine $path
            Write-Host "$name PE machine=0x$($machine.ToString('X4'))"
            if ($machine -ne 0x8664) {
              throw "$name is not an x64 PE binary"
            }
          }

      - name: Run x64 WebCodex binaries under Windows ARM64 emulation
        shell: pwsh
        run: |
          $cli = Join-Path $env:WEBCODEX_X64_BIN "webcodex.exe"
          $runner = Join-Path $env:WEBCODEX_X64_BIN "webcodex-runner.exe"
          $server = Join-Path $env:WEBCODEX_X64_BIN "webcodex-server.exe"

          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "webcodex.exe --version failed" }
          & $cli --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "webcodex.exe --help failed" }
          & $runner --version
          if ($LASTEXITCODE -ne 0) { throw "webcodex-runner.exe --version failed" }
          & $server --version
          if ($LASTEXITCODE -ne 0) { throw "webcodex-server.exe --version failed" }
