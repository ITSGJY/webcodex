name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Type-check frontend
        run: npm --prefix frontend run typecheck
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Verify committed frontend build
        run: npm --prefix frontend run check:dist
      - name: Verify workspace boundaries
        run: |
          bash scripts/workspace_boundary_check.sh --self-test
          bash scripts/workspace_boundary_check.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked --workspace

  test-windows:
    # Windows release gate: the crates that must run natively on Windows 11
    # (CLI, Runner, persistent-shell's fail-closed gate, and the
    # cross-platform libraries they depend on), the npm distribution checks,
    # and the full Windows artifact -> npm install smoke. The Server and its
    # Unix-only runtime stay Linux-only.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked -p webcodex-agent-config -p webcodex-process -p webcodex-persistent-shell -p webcodex-cli -p webcodex-runner
      - name: Test npm installer and release manifest natively
        run: npm --prefix npm/webcodex test
      - name: Windows artifact to npm install smoke
        # Builds the three Windows binaries, packages the win32-x64 artifact
        # with the native PowerShell script, installs it through the npm
        # installer into a temporary prefix, and verifies the wrapper plus
        # --version/--help and the failure-preserves-old-binaries path. Never
        # touches the npm registry.
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/npm_install_windows_smoke.ps1

  test-windows-arm64-x64-emulation:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: arm64

      - name: Verify ARM64 host and native Node
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          $nodePlatform = node -p "process.platform"
          $nodeArch = node -p "process.arch"
          Write-Host "node platform=$nodePlatform arch=$nodeArch"
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "expected an ARM64 Windows runner"
          }
          if ($nodePlatform -ne "win32" -or $nodeArch -ne "arm64") {
            throw "expected native win32-arm64 Node.js"
          }

      - name: Test npm installer source on ARM64
        run: npm --prefix npm/webcodex test

      - name: Install published x64 artifact from native ARM64 npm
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/npm_install_windows_arm64_compat_smoke.ps1

  test-windows-arm64-native:
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Verify native ARM64 Rust toolchain
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          rustc -vV
          $hostLine = rustc -vV | Select-String '^host: '
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "expected an ARM64 Windows runner"
          }
          if ($hostLine.Line -ne 'host: aarch64-pc-windows-msvc') {
            throw "expected native aarch64-pc-windows-msvc rustc host; got $($hostLine.Line)"
          }

      - name: Build native ARM64 binaries
        run: cargo build --locked --release --target aarch64-pc-windows-msvc -p webcodex -p webcodex-cli -p webcodex-runner

      - name: Verify ARM64 PE binaries and execute
        shell: pwsh
        run: |
          $binDir = Join-Path $PWD 'target\aarch64-pc-windows-msvc\release'
          $binaries = @('webcodex.exe', 'webcodex-server.exe', 'webcodex-runner.exe')
          foreach ($name in $binaries) {
            $path = Join-Path $binDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "missing native ARM64 binary: $path"
            }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 0x40) {
              throw "$name is too small to be a PE image"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) {
              throw "$name has an invalid PE header offset"
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            Write-Host "$name PE machine=0x$($machine.ToString('X4'))"
            if ($machine -ne 0xAA64) {
              throw "$name is not an ARM64 PE binary"
            }
          }

          & (Join-Path $binDir 'webcodex.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 webcodex --version failed' }
          & (Join-Path $binDir 'webcodex.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 webcodex --help failed' }
          & (Join-Path $binDir 'webcodex-runner.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 webcodex-runner --version failed' }
          & (Join-Path $binDir 'webcodex-server.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 webcodex-server --version failed' }

  oneoff-win32-arm64-v035-package:
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      WEBCODEX_BUILT_AT: "1786454000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3.5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: arm64

      - name: Verify immutable v0.3.5 source and ARM64 host
        shell: pwsh
        run: |
          $expectedCommit = '87420c1502c1dd599e3f8e986fc1b281832936c7'
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($actualCommit -ne $expectedCommit) {
            throw "expected v0.3.5 commit $expectedCommit; got $actualCommit"
          }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw 'expected an ARM64 Windows runner'
          }
          $hostLine = rustc -vV | Select-String '^host: '
          if ($hostLine.Line -ne 'host: aarch64-pc-windows-msvc') {
            throw "expected native aarch64-pc-windows-msvc rustc host; got $($hostLine.Line)"
          }
          $nodeArch = node -p "process.arch"
          if ($nodeArch -ne 'arm64') {
            throw "expected native ARM64 Node.js; got $nodeArch"
          }

      - name: Build immutable native ARM64 v0.3.5 binaries
        run: cargo build --locked --release --target aarch64-pc-windows-msvc -p webcodex -p webcodex-cli -p webcodex-runner

      - name: Verify native binary provenance
        shell: pwsh
        run: |
          $expectedCommit = '87420c1502c1dd599e3f8e986fc1b281832936c7'
          $expectedCommitShort = $expectedCommit.Substring(0, 12)
          $binDir = Join-Path $PWD 'target\aarch64-pc-windows-msvc\release'
          $binaries = @('webcodex.exe', 'webcodex-server.exe', 'webcodex-runner.exe')
          foreach ($name in $binaries) {
            $path = Join-Path $binDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "missing native ARM64 binary: $path"
            }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xAA64) {
              throw "$name is not an ARM64 PE binary: 0x$($machine.ToString('X4'))"
            }
            $versionOutput = (& $path --version | Out-String).Trim()
            Write-Host "$name machine=0xAA64 version=$versionOutput"
            foreach ($required in @('0.3.5', "commit $expectedCommitShort", 'dirty=false', "built_at=$env:WEBCODEX_BUILT_AT")) {
              if (-not $versionOutput.Contains($required)) {
                throw "$name provenance missing '$required': $versionOutput"
              }
            }
          }
          & (Join-Path $binDir 'webcodex.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 webcodex --help failed' }

      - name: Pack and smoke one-off npm package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = Join-Path $PWD 'target\aarch64-pc-windows-msvc\release'
          $outRoot = Join-Path $env:RUNNER_TEMP 'webcodex-win32-arm64-oneoff'
          $stage = Join-Path $outRoot 'package'
          $raw = Join-Path $outRoot 'raw'
          $prefix = Join-Path $env:RUNNER_TEMP 'webcodex-win32-arm64-install'
          Remove-Item -Recurse -Force $outRoot, $prefix -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $stage 'bin'), (Join-Path $stage 'vendor\bin'), $raw | Out-Null

          Copy-Item 'npm\webcodex\bin\webcodex.js' (Join-Path $stage 'bin\webcodex.js')
          Copy-Item 'npm\webcodex\bin\wrapper.js' (Join-Path $stage 'bin\wrapper.js')
          $binaryNames = @('webcodex.exe', 'webcodex-server.exe', 'webcodex-runner.exe')
          foreach ($name in $binaryNames) {
            Copy-Item (Join-Path $binDir $name) (Join-Path $stage "vendor\bin\$name")
            Copy-Item (Join-Path $binDir $name) (Join-Path $raw $name)
          }

          $packageJson = [ordered]@{
            name = '@yyjeqhc/webcodex-win32-arm64'
            version = '0.3.5'
            description = 'One-off native Windows ARM64 distribution for WebCodex 0.3.5.'
            license = 'Apache-2.0'
            os = @('win32')
            cpu = @('arm64')
            bin = [ordered]@{ webcodex = 'bin/webcodex.js' }
            files = @('bin', 'vendor', 'README.md', 'PROVENANCE.json')
            engines = [ordered]@{ node = '>=18' }
            repository = [ordered]@{ url = 'git+https://github.com/yyjeqhc/webcodex.git' }
            homepage = 'https://github.com/yyjeqhc/webcodex#readme'
          }
          $packageJson | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $stage 'package.json') -Encoding utf8NoBOM

          @'
          # @yyjeqhc/webcodex-win32-arm64

          One-off native Windows ARM64 distribution for WebCodex 0.3.5.
          It bundles the native binaries directly and does not replace or modify @yyjeqhc/webcodex.
          '@ | Set-Content -LiteralPath (Join-Path $stage 'README.md') -Encoding utf8NoBOM

          $hashes = [ordered]@{}
          foreach ($name in $binaryNames) {
            $hashes[$name] = (Get-FileHash -Algorithm SHA256 (Join-Path $stage "vendor\bin\$name")).Hash.ToLowerInvariant()
          }
          $provenance = [ordered]@{
            version = '0.3.5'
            source_tag = 'v0.3.5'
            source_commit = '87420c1502c1dd599e3f8e986fc1b281832936c7'
            target = 'aarch64-pc-windows-msvc'
            built_at = [long]$env:WEBCODEX_BUILT_AT
            files = $hashes
          }
          $provenance | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $stage 'PROVENANCE.json') -Encoding utf8NoBOM

          npm pack $stage --pack-destination $outRoot
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $tgz = Get-ChildItem -LiteralPath $outRoot -Filter '*.tgz' | Select-Object -First 1
          if (-not $tgz) { throw 'npm pack did not produce a tarball' }
          Write-Host "tarball=$($tgz.Name) sha256=$((Get-FileHash -Algorithm SHA256 $tgz.FullName).Hash.ToLowerInvariant())"

          npm install --global --prefix $prefix $tgz.FullName
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 npm tarball install failed' }
          $wrapper = Join-Path $prefix 'webcodex.cmd'
          & $wrapper --version
          if ($LASTEXITCODE -ne 0) { throw 'installed webcodex wrapper failed' }
          $installedBin = Join-Path $prefix 'node_modules\@yyjeqhc\webcodex-win32-arm64\vendor\bin'
          foreach ($name in $binaryNames) {
            $sourceHash = (Get-FileHash -Algorithm SHA256 (Join-Path $binDir $name)).Hash
            $installedHash = (Get-FileHash -Algorithm SHA256 (Join-Path $installedBin $name)).Hash
            if ($sourceHash -ne $installedHash) {
              throw "installed $name differs from the tested build"
            }
          }

      - name: Upload exact tested ARM64 npm tarball and binaries
        uses: actions/upload-artifact@v4
        with:
          name: webcodex-v0.3.5-win32-arm64-oneoff
          path: ${{ runner.temp }}\webcodex-win32-arm64-oneoff\*
          if-no-files-found: error
          compression-level: 0

  oneoff-win32-arm64-public-acceptance:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: arm64
      - name: Install public one-off package when available
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw 'expected an ARM64 Windows runner'
          }
          $published = npm view @yyjeqhc/webcodex-win32-arm64@0.3.5 version 2>$null
          if ($LASTEXITCODE -ne 0 -or ($published | Out-String).Trim() -ne '0.3.5') {
            Write-Host 'one-off package is not public yet; pre-publication acceptance skipped'
            exit 0
          }
          $prefix = Join-Path $env:RUNNER_TEMP 'webcodex-win32-arm64-public-install'
          Remove-Item -Recurse -Force $prefix -ErrorAction SilentlyContinue
          npm install --global --prefix $prefix @yyjeqhc/webcodex-win32-arm64@0.3.5
          if ($LASTEXITCODE -ne 0) { throw 'public ARM64 package install failed' }
          & (Join-Path $prefix 'webcodex.cmd') --version
          if ($LASTEXITCODE -ne 0) { throw 'public ARM64 webcodex wrapper failed' }
